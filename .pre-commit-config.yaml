# Local secret and key-material guard (Constitution IX). Install with: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: readme-status
        name: README progress matches tasks.md
        entry: scripts/readme-status.sh --check
        language: system
        files: ^(README\.md|specs/.*/tasks\.md)$
        pass_filenames: false
