# T014 spike: can OpenMLS run in browsers and re-key a 256-member group in time?
# Throwaway: kept out of the workspace so it is not subject to production lint rules.
[package]
name = "openmls-wasm-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
wasm-bindgen = "=0.2.129"
web-time = "=1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["js"] }
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
