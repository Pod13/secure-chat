[package]
name = "server-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the main workspace: fuzzing needs nightly Rust and cargo-fuzz.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
server = { path = ".." }

[[bin]]
name = "schema_validation"
path = "fuzz_targets/schema_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frames"
path = "fuzz_targets/ws_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_protocol_header"
path = "fuzz_targets/ws_protocol_header.rs"
test = false
doc = false
bench = false

