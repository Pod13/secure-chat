name: Release

# Releases are built reproducibly from a version tag. The signing key lives in an HSM and is never
# available to this workflow: the build publishes the exact bytes to be signed, a person performs
# the signing ceremony, and the signature (public data) is attached in a second, manual run.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run id of the build to finish (from the tag build)'
        required: true
      signature:
        description: 'Base64url Ed25519 signature over manifest.unsigned.txt, made in the HSM'
        required: true
      key_id:
        description: 'Id of the signing key used (must be in RELEASE_PUBLIC_KEYS)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Reproducible build and provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Build
        env:
          RELEASE_PUBLIC_KEYS: ${{ vars.RELEASE_PUBLIC_KEYS }}
          VERSION: ${{ github.ref_name }}
          MIN_CLIENT_VERSION: ${{ vars.MIN_CLIENT_VERSION }}
          KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: build/build.sh "${VERSION#v}" "$MIN_CLIENT_VERSION" "$KEY_ID" "$GITHUB_WORKSPACE/release"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned
          path: release/
          if-no-files-found: error

  attach-signature:
    name: Attach the HSM signature
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release-signing # requires manual approval
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the signature and write manifest.json
        env:
          SIGNATURE: ${{ inputs.signature }}
          KEY_ID: ${{ inputs.key_id }}
          RELEASE_PUBLIC_KEYS: ${{ vars.RELEASE_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNATURE" > signature.txt
          # Find the public key for KEY_ID in "id:key,id2:key2".
          printf '%s' "$RELEASE_PUBLIC_KEYS" | tr ',' '\n' | awk -F: -v id="$KEY_ID" '$1 == id { printf "%s", $2 }' > public-key.txt
          test -s public-key.txt
          node build/sign-manifest.ts attach release signature.txt public-key.txt
      - name: Attest the signed release
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed
          path: release/
          if-no-files-found: error
