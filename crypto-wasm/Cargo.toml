[package]
name = "crypto-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
wasm-bindgen = "=0.2.129"

# Browser randomness and time for the WASM build only. OpenMLS's own `js` feature covers
# getrandom 0.4 and web-time; getrandom 0.2 (used by the RustCrypto provider) needs `js` too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["js"] }
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
